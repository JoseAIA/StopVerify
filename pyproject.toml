[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "stopverify"
version = "0.2.1"
description = "Exact certificates and independent checks for finite optimal stopping"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "José Á. Islas"}]
keywords = ["optimal stopping", "prophet inequalities", "verification", "probability"]
[tool.setuptools.packages.find]
include = ["stopverify*"]
